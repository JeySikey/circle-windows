name: circle_windows
version: 0.7.1+15
description: Circle Windows native desktop client with secure in-place GitHub auto-updates
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  livekit_client: ^2.13.2
  media_kit_libs_video: ^1.0.7
  record: ^6.0.0
  path_provider: ^2.1.5
  window_manager: ^0.4.3
  cryptography: ^2.7.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/circle-mark.png
