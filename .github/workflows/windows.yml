name: Circle Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name=circle_windows .
      - name: Circle branded Windows icon
        shell: pwsh
        run: Copy-Item 'branding/circle.ico' 'windows/runner/resources/app_icon.ico' -Force
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build native Windows exe
        shell: pwsh
        env:
          CIRCLE_UPDATE_URL: ${{ vars.CIRCLE_UPDATE_URL }}
          CIRCLE_UPDATE_PUBLIC_KEY: ${{ vars.CIRCLE_UPDATE_PUBLIC_KEY }}
        run: |
          $defs = @()
          if ($env:CIRCLE_UPDATE_URL -and $env:CIRCLE_UPDATE_PUBLIC_KEY) {
            $defs += '--dart-define=CIRCLE_UPDATE_URL=' + $env:CIRCLE_UPDATE_URL
            $defs += '--dart-define=CIRCLE_UPDATE_PUBLIC_KEY=' + $env:CIRCLE_UPDATE_PUBLIC_KEY
          }
          flutter build windows --release @defs
      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc '/DAppVersion=0.4.0' 'installer\Circle.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Circle-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Circle-Windows-Portable
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CIRCLE_SIGNING_KEY: ${{ secrets.CIRCLE_UPDATE_PRIVATE_KEY_PEM }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:CIRCLE_SIGNING_KEY) {
            throw 'Set secret CIRCLE_UPDATE_PRIVATE_KEY_PEM before publishing a version tag'
          }
          python -m pip install --disable-pip-version-check cryptography
          $installer = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $tag = '${{ github.ref_name }}'
          $expected = 'v0.4.0'
          if ($tag -ne $expected) { throw "Release tag $tag does not match app version $expected" }
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($installer.Name)"
          $keyFile = Join-Path $env:RUNNER_TEMP 'circle-signing-key.pem'
          [System.IO.File]::WriteAllText($keyFile, $env:CIRCLE_SIGNING_KEY)
          try {
            python tool/sign_release.py --private-key $keyFile --package $installer.FullName --version 0.4.0 --url $url --output update-manifest.json
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }
            gh release create $tag $installer.FullName 'update-manifest.json' --title "Circle Windows $tag" --notes 'Native Windows release. Download the EXE installer.'
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
          } finally {
            if (Test-Path $keyFile) { Remove-Item $keyFile -Force }
          }
