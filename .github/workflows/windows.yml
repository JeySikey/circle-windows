name: Circle Windows build
# Artifacts are NOT releases. On a successful main/master build, publish a
# signed stable Release automatically when the app version has increased.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: circle-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Require signing key before building an update-enabled client
        shell: pwsh
        env:
          CIRCLE_SIGNING_KEY: ${{ secrets.CIRCLE_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          if (-not $env:CIRCLE_SIGNING_KEY) {
            throw 'Missing signing key. Run Actions > Circle signing key setup first (see docs/GITHUB-AUTO-UPDATE.md).'
          }
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name=circle_windows .
      - name: Circle branded icon
        shell: pwsh
        run: Copy-Item 'branding/circle.ico' 'windows/runner/resources/app_icon.ico' -Force
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Validate project files
        shell: pwsh
        run: |
          python tool/validate_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Project validation failed. Check the required-file list and embedded installer checks above.' }
          python tool/test_release_decision.py
          if ($LASTEXITCODE -ne 0) { throw 'Release-decision tests failed' }
      - name: Validate native API compatibility and permissions
        run: |
          python tool/check_api_contract.py
          python tool/check_desktop_contract.py
      - name: Offline signed update protocol tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python tool/self_test_update.py
          python tool/test_bootstrap_keys.py
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test

      - name: Prepare pinned public key for update channel
        id: signing
        shell: pwsh
        env:
          CIRCLE_SIGNING_KEY: ${{ secrets.CIRCLE_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          if (-not $env:CIRCLE_SIGNING_KEY) {
            throw 'Missing CIRCLE_UPDATE_PRIVATE_KEY_PEM repository secret'
          } else {
            python -m pip install --disable-pip-version-check cryptography
            $keyFile = Join-Path $env:RUNNER_TEMP 'circle-release-key.pem'
            [IO.File]::WriteAllText($keyFile, $env:CIRCLE_SIGNING_KEY)
            $line = python tool/release_keys.py --private-key $keyFile
            if ($LASTEXITCODE -ne 0) { throw 'Unable to derive release public key' }
            $public = ($line | Select-String '^PUBLIC_KEY_BASE64=').ToString().Split('=',2)[1]
            "public=$public" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Remove-Item -LiteralPath $keyFile -Force
          }
      - name: Build independent Circle Windows native EXE
        shell: pwsh
        env:
          CIRCLE_REPOSITORY: ${{ github.repository }}
          CIRCLE_PUBLIC: ${{ steps.signing.outputs.public }}
        run: |
          flutter build windows --release --dart-define=CIRCLE_GITHUB_REPO=$env:CIRCLE_REPOSITORY --dart-define=CIRCLE_UPDATE_PUBLIC_KEY=$env:CIRCLE_PUBLIC
          if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows build failed' }
      - name: Include app-local MSVC and detached updater
        shell: pwsh
        run: ./tool/package_windows.ps1
      - name: Build Inno Setup installer for initial installation
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc '/DAppVersion=0.7.1' 'installer\Circle.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Build ZIP for silent in-place upgrades (no installer)
        run: python tool/build_payload.py --version 0.7.1
      - name: Verify signed payload ZIP passes updater safety rules
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter '*_Payload.zip' | Select-Object -First 1
          if (-not $zip) {throw 'Missing update ZIP'}
          $digest = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tool/apply_update.ps1 -Archive $zip.FullName -ExpectedSha256 $digest -ExePath "$pwd\build\windows\x64\runner\Release\circle_windows.exe" -ParentPid 999999 -Version 0.7.1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) {throw 'Updater validation failed'}
      - name: Integration-test in-place updater with real ZIP and rollback guard
        shell: pwsh
        timeout-minutes: 12
        run: ./tool/test_update_apply.ps1
      - name: Upload updater diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Circle-Updater-Diagnostics
          path: ${{ runner.temp }}/circle-update-verification/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify installed runtime contents
        shell: pwsh
        timeout-minutes: 8
        run: ./tool/verify_installer.ps1
      - name: Upload installer diagnostics if verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Circle-Installer-Diagnostics
          path: ${{ runner.temp }}/circle-setup-verification/*.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Circle-Windows-Setup
          path: dist/*_Setup.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Circle-Windows-Update-ZIP
          path: dist/*_Payload.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Circle-Windows-Portable
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 30

      - name: Decide whether a new stable GitHub Release is needed
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python tool/release_decision.py --version 0.7.1
          if ($LASTEXITCODE -ne 0) { throw 'Release decision failed; inspect the error (private repo, existing tag or version conflict)' }

      - name: Publish signed Release for installed-app auto-updates
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          CIRCLE_SIGNING_KEY: ${{ secrets.CIRCLE_UPDATE_PRIVATE_KEY_PEM }}
          GH_TOKEN: ${{ github.token }}
          CIRCLE_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CIRCLE_REPOSITORY: ${{ github.repository }}
          CIRCLE_COMMIT: ${{ github.sha }}
        run: |
          if (-not $env:CIRCLE_SIGNING_KEY) { throw 'Missing CIRCLE_UPDATE_PRIVATE_KEY_PEM' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'circle-release-key.pem'
          [IO.File]::WriteAllText($keyFile, $env:CIRCLE_SIGNING_KEY)
          try {
            $payload = Get-ChildItem dist/*_Payload.zip | Select-Object -First 1
            $installer = Get-ChildItem dist/*_Setup.exe | Select-Object -First 1
            if (!$payload -or !$installer) {throw 'Release assets absent'}
            $assetUrl = "https://github.com/$env:CIRCLE_REPOSITORY/releases/download/$env:CIRCLE_RELEASE_TAG/$($payload.Name)"
            python tool/sign_release.py --private-key $keyFile --package $payload.FullName --version 0.7.1 --url $assetUrl --output update-manifest.json
            if ($LASTEXITCODE -ne 0) {throw 'Signature step failed'}
            gh release create $env:CIRCLE_RELEASE_TAG $installer.FullName $payload.FullName 'update-manifest.json' --target $env:CIRCLE_COMMIT --title 'Circle Windows 0.7.1' --notes 'Stable native Windows update; signed runtime ZIP; no reinstallation required.' --latest
            if ($LASTEXITCODE -ne 0) {throw 'GitHub Release publishing failed'}
            Write-Host "Published $env:CIRCLE_RELEASE_TAG. App update feed: https://github.com/$env:CIRCLE_REPOSITORY/releases/latest/download/update-manifest.json"
          } finally {
            if (Test-Path $keyFile) {Remove-Item -LiteralPath $keyFile -Force}
          }
