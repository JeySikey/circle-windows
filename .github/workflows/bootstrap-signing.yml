name: Circle signing key setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circle-release-signing-bootstrap
  cancel-in-progress: false

jobs:
  create-and-save-key:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate temporary token is provided
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CIRCLE_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Missing CIRCLE_BOOTSTRAP_TOKEN. Create a fine-grained PAT with Secrets read/write for this repository and store as an Actions repository secret.'
            exit 1
          fi
      - name: Generate Ed25519 private key in memory and securely save to GitHub Secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CIRCLE_BOOTSTRAP_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography
          python tool/bootstrap_github_keys.py --repository "$REPOSITORY"
